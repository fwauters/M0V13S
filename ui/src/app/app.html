<!--
  Shell : header permanent + zone de routing des features.
  Règles : directive *transloco (jamais le pipe), aucun appel de méthode
  en template (signaux et pipes purs uniquement), styles Tailwind.
-->
<ng-container *transloco="let t">
  <div class="flex min-h-screen flex-col">
    <!-- Header sticky translucide (charte 3.1) : le contenu défile dessous
         avec un flou — lisible sur les affiches comme sur les fonds unis. -->
    <header
      class="sticky top-0 z-40 flex items-center gap-2 border-b border-black/10 bg-white/75 px-6 py-2.5 backdrop-blur-md dark:border-white/10 dark:bg-black/60"
    >
      <!-- Wordmark (police 3.5 : token --font-wordmark) — retour accueil. -->
      <a routerLink="/" class="mr-4 font-wordmark text-xl font-bold tracking-widest text-brand">
        M0V13S
      </a>

      <!-- Navigation principale : état actif surligné par le router. -->
      <nav class="flex items-center gap-1 text-sm">
        <a
          routerLink="/"
          routerLinkActive="bg-black/5 font-medium opacity-100 dark:bg-white/10"
          [routerLinkActiveOptions]="{ exact: true }"
          class="rounded-full px-3 py-1.5 opacity-70 transition hover:opacity-100"
        >
          {{ t('shell.navHome') }}
        </a>
        <!-- Bibliothèque : cachée tant que rien n'est reconnu (scan forcé). -->
        @if (!store.forcedScan()) {
          <a
            routerLink="/browse"
            routerLinkActive="bg-black/5 font-medium opacity-100 dark:bg-white/10"
            class="rounded-full px-3 py-1.5 opacity-70 transition hover:opacity-100"
          >
            {{ t('shell.navBrowse') }}
          </a>
        }
        <a
          routerLink="/scan"
          routerLinkActive="bg-black/5 font-medium opacity-100 dark:bg-white/10"
          class="rounded-full px-3 py-1.5 opacity-70 transition hover:opacity-100"
        >
          {{ t('shell.navScan') }}
        </a>
      </nav>

      <span class="grow"></span>

      <!-- Vue admin des tables (outil de contrôle, lecture seule en phase 1). -->
      <a
        matIconButton
        routerLink="/admin/data"
        [attr.aria-label]="t('shell.adminData')"
        [title]="t('shell.adminData')"
      >
        <mat-icon>table_view</mat-icon>
      </a>

      <!-- Sélecteur de langue : changement à chaud via LanguageService. -->
      <mat-button-toggle-group
        hideSingleSelectionIndicator
        [attr.aria-label]="t('shell.language')"
        [value]="language.lang()"
        (change)="onLangChange($event.value)"
      >
        @for (lang of language.availableLangs; track lang) {
          <mat-button-toggle [value]="lang">{{ lang | uppercase }}</mat-button-toggle>
        }
      </mat-button-toggle-group>

      <!-- Interrupteur de thème : un seul signal pilote Material + Tailwind. -->
      <button
        matIconButton
        [attr.aria-label]="theme.theme() === 'dark' ? t('shell.themeToLight') : t('shell.themeToDark')"
        (click)="theme.toggle()"
      >
        <mat-icon>{{ theme.theme() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
    </header>

    <!-- Zone des features (home, browse, detail, scan, admin). -->
    <main class="flex grow flex-col">
      <router-outlet />
    </main>
  </div>
</ng-container>
