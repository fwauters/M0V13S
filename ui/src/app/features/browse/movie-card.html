<!-- Carte d'affiche : ratio 2/3 constant, zoom + anneau brand au survol. -->
<ng-container *transloco="let t">
  <a [routerLink]="['/movie', movie().id]" class="group flex w-full flex-col gap-1.5">
    <!-- Conteneur relatif : l'affiche + le badge « vu » (phase 4). -->
    <span class="relative block">
      @if (movie().posterPath | sidecarImg: 'thumb'; as posterSrc) {
        <img
          [src]="posterSrc"
          alt=""
          loading="lazy"
          class="aspect-2/3 w-full rounded-lg object-cover shadow-sm transition duration-200 group-hover:scale-[1.03] group-hover:ring-2 group-hover:ring-brand"
        />
      } @else {
        <!-- Pochette de repli quand aucune affiche sidecar n'existe. -->
        <span
          class="flex aspect-2/3 w-full items-center justify-center rounded-lg bg-black/10 transition duration-200 group-hover:scale-[1.03] group-hover:ring-2 group-hover:ring-brand dark:bg-white/10"
        >
          <mat-icon class="scale-150 opacity-40">movie</mat-icon>
        </span>
      }
      <!-- Vu jusqu'au bout : coche discrète en coin d'affiche. -->
      @if (movie().seen) {
        <span
          class="absolute right-1.5 top-1.5 flex size-6 items-center justify-center rounded-full bg-black/60 text-white"
          [title]="t('browse.seenBadge')"
        >
          <mat-icon inline>check</mat-icon>
        </span>
      }
    </span>

    <span class="truncate text-sm font-medium">{{ title() }}</span>
    <span class="text-xs opacity-60">
      @if (movie().year !== null) {
        {{ movie().year }}
      }
      @if (movie().durationSec | minutes; as min) {
        · {{ t('browse.minutes', { min }) }}
      }
    </span>
  </a>
</ng-container>
